name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          source .venv/bin/activate
          flake8 ardd.py test_ardd.py
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -q
